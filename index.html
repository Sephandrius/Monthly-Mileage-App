<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.W. Frierson Mileage Reimbursement Processor</title>
    <!-- Load libraries directly from CDNs with integrity checks -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FAF7F5;
            color: #333333;
        }
        
        header {
            background-color: #333333;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1, h2 {
            color: #333333;
        }
        
        .dropzone {
            border: 3px dashed #EBC42E;
            padding: 30px;
            text-align: center;
            margin: 20px 0;
            border-radius: 5px;
        }
        
        button, .file-input-label {
            background-color: #30526E;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            display: inline-block;
        }
        
        .file-input {
            display: none;
        }
        
        .process-button {
            background-color: #EBC42E;
            color: black;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        th, td {
            border: 1px solid #D1CCC7;
            padding: 8px;
            text-align: left;
        }
        
        th {
            background-color: #D1CCC7;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .error {
            color: red;
            background-color: #fee;
            padding: 10px;
            border-left: 3px solid red;
            margin: 10px 0;
        }
        
        footer {
            background-color: #333333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>T.W. FRIERSON CONTRACTOR, INC.</h1>
        <p>Mileage Reimbursement Processor</p>
    </header>
    
    <div id="app" class="container">
        <p>Loading application...</p>
    </div>
    
    <footer>
        <p>T.W. FRIERSON CONTRACTOR, INC. - Building with Purpose</p>
    </footer>

    <script type="text/babel">
        // Basic React component
        function MileageProcessor() {
            const [files, setFiles] = React.useState([]);
            const [employees, setEmployees] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [expandedEmployee, setExpandedEmployee] = React.useState(null);
            
            // Handle file selection
            const handleFileSelect = (e) => {
                const selectedFiles = e.target.files;
                if (selectedFiles.length > 0) {
                    setFiles(Array.from(selectedFiles));
                }
            };
            
            // Process files button
            const processFiles = async () => {
                setLoading(true);
                setError(null);
                
                try {
                    const processedEmployees = [];
                    const rates = {};
                    
                    for (const file of files) {
                        try {
                            const arrayBuffer = await file.arrayBuffer();
                            const workbook = XLSX.read(arrayBuffer, {type: 'array'});
                            
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            
                            // Extract data
                            const employeeName = worksheet['B2']?.v || 'Unknown';
                            const totalMiles = parseFloat(worksheet['B3']?.v) || 0;
                            const irsRate = parseFloat(worksheet['B4']?.v) || 0;
                            const reportedReimbursement = parseFloat(worksheet['B5']?.v) || 0;
                            
                            rates[irsRate] = (rates[irsRate] || 0) + 1;
                            
                            // Get individual entries
                            const entries = [];
                            let rowIndex = 7;
                            let entryTotalMiles = 0;
                            
                            while (worksheet[`A${rowIndex}`]) {
                                const date = worksheet[`A${rowIndex}`]?.v || '';
                                const purpose = worksheet[`B${rowIndex}`]?.v || '';
                                const description = worksheet[`C${rowIndex}`]?.v || '';
                                const miles = parseFloat(worksheet[`D${rowIndex}`]?.v) || 0;
                                
                                entries.push({
                                    date,
                                    purpose,
                                    description,
                                    miles
                                });
                                
                                entryTotalMiles += miles;
                                rowIndex++;
                            }
                            
                            // Validation
                            const milesMatch = Math.abs(totalMiles - entryTotalMiles) < 0.01;
                            
                            processedEmployees.push({
                                name: employeeName,
                                fileName: file.name,
                                totalMiles,
                                irsRate,
                                reportedReimbursement,
                                entries,
                                milesMatch,
                                entryTotalMiles,
                                calculatedReimbursement: entryTotalMiles * irsRate
                            });
                        } catch (err) {
                            console.error(`Error processing file ${file.name}:`, err);
                            setError(`Error processing file ${file.name}. Please check the file format.`);
                        }
                    }
                    
                    // Find most common rate
                    let mostCommonRate = 0;
                    let maxCount = 0;
                    
                    Object.entries(rates).forEach(([rate, count]) => {
                        if (count > maxCount) {
                            maxCount = count;
                            mostCommonRate = parseFloat(rate);
                        }
                    });
                    
                    // Apply consensus rate
                    const finalEmployees = processedEmployees.map(employee => ({
                        ...employee,
                        consensusRate: mostCommonRate,
                        consensusReimbursement: employee.entryTotalMiles * mostCommonRate
                    }));
                    
                    setEmployees(finalEmployees);
                } catch (err) {
                    console.error("General processing error:", err);
                    setError("Error processing files. Please make sure all files are valid Excel spreadsheets.");
                } finally {
                    setLoading(false);
                }
            };
            
            // Toggle expanded view
            const toggleEmployeeExpand = (index) => {
                if (expandedEmployee === index) {
                    setExpandedEmployee(null);
                } else {
                    setExpandedEmployee(index);
                }
            };
            
            // Export to Excel
            const exportToExcel = () => {
                const exportData = employees.map(employee => ({
                    'Employee Name': employee.name,
                    'Total Miles': employee.entryTotalMiles,
                    'Reimbursement': employee.consensusReimbursement.toFixed(2)
                }));
                
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Mileage Reimbursements");
                
                // Generate filename
                const date = new Date();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                const filename = `TW_Frierson_Mileage_${month}_${year}.xlsx`;
                
                XLSX.writeFile(workbook, filename);
            };
            
            return (
                <div>
                    <h2>Mileage Reimbursement Processor</h2>
                    
                    <p>
                        Upload Excel files containing employee mileage data. The app will process them
                        and create a summary report.
                    </p>
                    
                    <div 
                        className="dropzone" 
                        onDrop={(e) => {
                            e.preventDefault();
                            const items = e.dataTransfer.items;
                            const fileList = [];
                            
                            // Process all dropped items (files and folders)
                            const processEntry = async (entry) => {
                                if (entry.isFile) {
                                    entry.file(file => {
                                        if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                                            fileList.push(file);
                                        }
                                    });
                                } else if (entry.isDirectory) {
                                    const dirReader = entry.createReader();
                                    dirReader.readEntries(entries => {
                                        entries.forEach(entry => processEntry(entry));
                                    });
                                }
                            };
                            
                            // If webkitGetAsEntry is available (Chrome, Edge)
                            if (items[0].webkitGetAsEntry) {
                                for (let i = 0; i < items.length; i++) {
                                    const entry = items[i].webkitGetAsEntry();
                                    if (entry) {
                                        processEntry(entry);
                                    }
                                }
                            } else {
                                // Fallback to files
                                const files = e.dataTransfer.files;
                                for (let i = 0; i < files.length; i++) {
                                    if (files[i].name.endsWith('.xlsx') || files[i].name.endsWith('.xls')) {
                                        fileList.push(files[i]);
                                    }
                                }
                            }
                            
                            // Update state after processing
                            setTimeout(() => {
                                if (fileList.length > 0) {
                                    setFiles(fileList);
                                }
                            }, 100);
                        }}
                        onDragOver={(e) => e.preventDefault()}
                        onDragEnter={(e) => e.preventDefault()}
                    >
                        <p>Drag & drop a folder or files containing employee mileage data</p>
                        <p>- OR -</p>
                        
                        <label className="file-input-label">
                            Select Files
                            <input 
                                type="file" 
                                multiple 
                                onChange={handleFileSelect} 
                                className="file-input" 
                                accept=".xlsx,.xls"
                            />
                        </label>
                        
                        {files.length > 0 && (
                            <div>
                                <p>{files.length} file(s) selected</p>
                                <button className="process-button" onClick={processFiles} disabled={loading}>
                                    {loading ? 'Processing...' : 'Process Files'}
                                </button>
                            </div>
                        )}
                    </div>
                    
                    {error && <div className="error">{error}</div>}
                    
                    {employees.length > 0 && (
                        <div>
                            <h3>Results</h3>
                            <p>Consensus IRS rate: ${employees[0].consensusRate.toFixed(3)} per mile</p>
                            
                            <table>
                                <thead>
                                    <tr>
                                        <th>Employee</th>
                                        <th>Total Miles</th>
                                        <th>Reimbursement</th>
                                        <th>Status</th>
                                        <th>Details</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {employees.map((employee, index) => (
                                        <React.Fragment key={index}>
                                            <tr>
                                                <td>{employee.name}<br /><small>{employee.fileName}</small></td>
                                                <td>
                                                    {employee.entryTotalMiles.toFixed(1)}
                                                    {!employee.milesMatch && 
                                                        <div style={{color: 'red'}}>
                                                            (Reported: {employee.totalMiles.toFixed(1)})
                                                        </div>
                                                    }
                                                </td>
                                                <td>
                                                    ${employee.consensusReimbursement.toFixed(2)}
                                                    <br />
                                                    <small>
                                                        Rate: ${employee.consensusRate.toFixed(3)}
                                                        {employee.irsRate !== employee.consensusRate && 
                                                            <span style={{color: 'red'}}>
                                                                (Reported: ${employee.irsRate.toFixed(3)})
                                                            </span>
                                                        }
                                                    </small>
                                                </td>
                                                <td>
                                                    {employee.milesMatch && Math.abs(employee.consensusReimbursement - employee.reportedReimbursement) <= 0.01 
                                                        ? <span style={{color: 'green'}}>✓ Valid</span>
                                                        : <span style={{color: 'red'}}>⚠ Discrepancy</span>
                                                    }
                                                </td>
                                                <td>
                                                    <button onClick={() => toggleEmployeeExpand(index)}>
                                                        {expandedEmployee === index ? 'Hide' : 'View'}
                                                    </button>
                                                </td>
                                            </tr>
                                            
                                            {expandedEmployee === index && (
                                                <tr>
                                                    <td colSpan="5" style={{backgroundColor: '#f9f9f9'}}>
                                                        <h4>Trip Details</h4>
                                                        <table>
                                                            <thead>
                                                                <tr>
                                                                    <th>Date</th>
                                                                    <th>Purpose</th>
                                                                    <th>Description</th>
                                                                    <th>Miles</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {employee.entries.map((entry, i) => (
                                                                    <tr key={i}>
                                                                        <td>{entry.date}</td>
                                                                        <td>{entry.purpose}</td>
                                                                        <td>{entry.description}</td>
                                                                        <td>{entry.miles.toFixed(1)}</td>
                                                                    </tr>
                                                                ))}
                                                                <tr style={{fontWeight: 'bold'}}>
                                                                    <td colSpan="3" style={{textAlign: 'right'}}>Total:</td>
                                                                    <td>{employee.entryTotalMiles.toFixed(1)}</td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </td>
                                                </tr>
                                            )}
                                        </React.Fragment>
                                    ))}
                                </tbody>
                            </table>
                            
                            <button onClick={exportToExcel}>Export Summary to Excel</button>
                        </div>
                    )}
                </div>
            );
        }
        
        // Render the app
        ReactDOM.render(<MileageProcessor />, document.getElementById('app'));
    </script>
</body>
</html>
