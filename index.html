<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.W. Frierson Mileage Reimbursement Processor</title>
    
    <!-- Load libraries directly from CDNs -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <!-- Google Fonts: Source Sans Pro and a serif font similar to Zilla Slab -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=Bitter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* T.W. Frierson brand colors */
        :root {
            --black: #333333; /* 4AM */
            --yellow: #EBC42E; /* HARD HAT */
            --blue: #30526E; /* BLUE COLLAR */
            --brick: #BA6E4D; /* BRICK */
            --concrete: #D1CCC7; /* CONCRETE */
            --white: #FAF7F5; /* REFLECTOR */
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background-color: var(--black);
            color: white;
            padding: 1.5rem 0;
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
        }
        
        .logo-icon {
            background-color: var(--yellow);
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }
        
        .company-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .company-title {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 1px;
        }
        
        main {
            flex: 1;
            padding: 3rem 0;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bitter', Georgia, serif;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        h2 {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        h3 {
            font-size: 1.5rem;
            border-bottom: 3px solid var(--yellow);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            display: inline-block;
        }
        
        .intro-text {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 2.5rem;
        }
        
        .dropzone {
            border: 4px dashed var(--yellow);
            border-radius: 8px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            text-align: center;
            transition: all 0.3s ease;
            background-color: rgba(235, 196, 46, 0.05);
            position: relative;
        }
        
        .dropzone:hover, .dropzone.active {
            background-color: rgba(235, 196, 46, 0.1);
        }
        
        .dropzone.has-files {
            border-color: #27ae60; /* Green for success */
            background-color: rgba(39, 174, 96, 0.05);
        }
        
        .icon-container {
            margin-bottom: 1.5rem;
        }
        
        .dropzone-icon {
            font-size: 2.5rem;
            color: var(--blue);
        }
        
        .files-selected {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--black);
        }
        
        .dropzone-instructions {
            margin-bottom: 1.5rem;
            color: #666;
        }
        
        .button-group {
            margin-top: 1.5rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-family: 'Source Sans Pro', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            outline: none;
            margin: 0 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background-color: var(--blue);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #264056;
        }
        
        .btn-secondary {
            background-color: var(--yellow);
            color: var(--black);
        }
        
        .btn-secondary:hover {
            background-color: #d4b32a;
        }
        
        .file-input {
            display: none;
        }
        
        .error-container {
            background-color: #ffebee;
            border-left: 5px solid #f44336;
            color: #d32f2f;
            padding: 1rem 1.5rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
        }
        
        .error-icon {
            margin-right: 1rem;

        }
        
        .results-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

        .results-header {

        table {

        thead {
            background-color: var(--concrete);

        th {
            text-align: left;
            padding: 1rem 1.5rem;
            font-family: 'Bitter', serif;
            font-weight: 600;
            color: var(--black);
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 0.05rem;
        }
        
        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e0e0e0;

        }
        
        tbody tr:hover {
            background-color: rgba(209, 204, 199, 0.1);
        }
        
        .employee-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--black);
        }
        
        .file-name {
            font-size: 0.85rem;
            color: #777;
            margin-top: 0.25rem;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .badge-valid {
            background-color: #d4edda;
            color: #155724;
        }
        
        .badge-error {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .icon-sm {
            margin-right: 0.35rem;
        }
        
        .view-toggle {
            background: none;
            border: none;
            color: var(--blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            transition: color 0.3s;
        }
        
        .view-toggle:hover {
            color: var(--black);
        }
        
        .toggle-icon {
            margin-left: 0.5rem;
        }
        
        .details-row {
            background-color: #f8f8f8;
        }
        
        .details-content {
            padding: 1.5rem 2rem;
        }
        
        .details-title {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }
        
        .details-table th,
        .details-table td {
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
        }
        
        .details-table tr:last-child td {
            border-bottom: none;
        }
        
        .total-row {
            background-color: var(--concrete);
            font-weight: 700;
        }
        
        .error-text {
            color: #dc3545;
            font-size: 0.85rem;
            margin-left: 0.5rem;
        }
        
        .results-footer {
            padding: 1.25rem 2rem;
            background-color: var(--concrete);
            display: flex;
            justify-content: flex-end;
        }
        
        footer {
            background-color: var(--black);
            color: white;
            padding: 2rem 0;
            text-align: center;
            margin-top: auto;
        }
        
        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .footer-logo {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .footer-icon {
            width: 36px;
            height: 36px;
            background-color: var(--yellow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
        }
        
        .footer-name {
            font-weight: 600;
            letter-spacing: 0.05rem;
            text-transform: uppercase;
        }
        
        .footer-message {
            color: #aaa;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--concrete);
            border-top-color: var(--yellow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .loading-text {
            color: white;
            margin-top: 1rem;
            font-size: 1.2rem;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .company-title {
                margin-top: 0.5rem;
            }
            
            h2 {
                font-size: 1.8rem;
            }
            
            .dropzone {
                padding: 1.5rem;
            }
            
            .btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
                margin-bottom: 0.5rem;
            }
            
            .button-group {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            
            th, td {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script type="text/babel">
        // Icon Components
        const FileIcon = ({size = 24, color = "currentColor"}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
        );
        
        const CheckIcon = ({size = 24, color = "currentColor"}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );
        
        const AlertIcon = ({size = 24, color = "currentColor"}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );
        
        const ChevronDownIcon = ({size = 24, color = "currentColor"}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        );
        
        const ChevronUpIcon = ({size = 24, color = "currentColor"}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        );
        
        const DownloadIcon = ({size = 24, color = "currentColor"}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );
        
        const HelmetIcon = ({size = 24, color = "currentColor"}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 4C7.58 4 4 7.58 4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7c0-4.42-3.58-8-8-8z"></path>
                <path d="M8 12h8"></path>
                <path d="M9 17v-5"></path>
                <path d="M15 17v-5"></path>
            </svg>
        );
        
        // Helper function to format Excel serial date
        const formatExcelDate = (serialDate) => {
            if (!serialDate) return '';
            
            // Excel serial date starts from 1900-01-01, which is 1
            // JavaScript date starts from 1970-01-01
            try {
                // Check if it's already a formatted date string
                if (typeof serialDate === 'string' && 
                    (serialDate.includes('/') || serialDate.includes('-'))) {
                    return serialDate;
                }
                
                // Parse the Excel serial date
                const excelEpoch = new Date(1900, 0, 1);
                const daysSinceEpoch = serialDate - 1; // Adjust for Excel's start date
                const millisecondsSinceEpoch = daysSinceEpoch * 24 * 60 * 60 * 1000;
                const date = new Date(excelEpoch.getTime() + millisecondsSinceEpoch);
                
                // Format date as MM/DD/YYYY
                return `${date.getMonth() + 1}/${date.getDate()}/${date.getFullYear()}`;
            } catch (e) {
                console.error("Error formatting date:", e);
                return String(serialDate); // Return original value if parsing fails
            }
        };
        
        function MileageProcessor() {
            const [files, setFiles] = React.useState([]);
            const [employees, setEmployees] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [mostCommonRate, setMostCommonRate] = React.useState(null);
            const [expandedEmployee, setExpandedEmployee] = React.useState(null);
            const [processingComplete, setProcessingComplete] = React.useState(false);
            const [isDragging, setIsDragging] = React.useState(false);
            
            // Handle file drop
            const handleDrop = (e) => {
                e.preventDefault();
                setError(null);
                setIsDragging(false);
                
                const items = e.dataTransfer.items;
                const droppedFiles = [];
                let pendingFiles = 0;
                
                // Process all dropped items (files and folders)
                const processEntry = async (entry) => {
                    if (entry.isFile) {
                        if (entry.name.endsWith('.xlsx') || entry.name.endsWith('.xls')) {
                            pendingFiles++;
                            entry.file(file => {
                                droppedFiles.push(file);
                                pendingFiles--;
                                
                                // When all files are processed
                                if (pendingFiles === 0 && droppedFiles.length > 0) {
                                    setFiles(droppedFiles);
                                }
                            });
                        }
                    } else if (entry.isDirectory) {
                        pendingFiles++;
                        const dirReader = entry.createReader();
                        dirReader.readEntries(entries => {
                            entries.forEach(subEntry => processEntry(subEntry));
                            pendingFiles--;
                        });
                    }
                };
                
                // If webkitGetAsEntry is available (Chrome, Edge)
                if (items && items[0]?.webkitGetAsEntry) {
                    for (let i = 0; i < items.length; i++) {
                        const entry = items[i].webkitGetAsEntry();
                        if (entry) {
                            processEntry(entry);
                        }
                    }
                } else {
                    // Fallback to regular files
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        const validFiles = Array.from(files).filter(
                            file => file.name.endsWith('.xlsx') || file.name.endsWith('.xls')
                        );
                        
                        if (validFiles.length > 0) {
                            setFiles(validFiles);
                        } else {
                            setError("No Excel files found. Please upload .xlsx or .xls files.");
                        }
                    }
                }
            };
            
            // Handle file selection via input
            const handleFileSelect = (e) => {
                setError(null);
                
                const selectedFiles = e.target.files;
                if (selectedFiles.length > 0) {
                    const validFiles = Array.from(selectedFiles).filter(
                        file => file.name.endsWith('.xlsx') || file.name.endsWith('.xls')
                    );
                    
                    if (validFiles.length > 0) {
                        setFiles(validFiles);
                    } else {
                        setError("No Excel files found. Please select .xlsx or .xls files.");
                    }
                }
            };
            
            // Process files
            const processFiles = async () => {
                if (files.length === 0) return;
                
                setLoading(true);
                setError(null);
                setProcessingComplete(false);
                setEmployees([]);
                
                try {
                    const processedEmployees = [];
                    const ratesCount = {};
                    
                    for (const file of files) {
                        try {
                            const arrayBuffer = await file.arrayBuffer();
                            const workbook = XLSX.read(arrayBuffer, {
                                type: 'array',
                                cellDates: true
                            });
                            
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            
                            // Get employee data
                            const employeeName = worksheet['B2']?.v || 'Unknown';
                            const totalMiles = parseFloat(worksheet['B3']?.v) || 0;
                            const irsRate = parseFloat(worksheet['B4']?.v) || 0;
                            const reportedReimbursement = parseFloat(worksheet['B5']?.v) || 0;
                            
                            // Count IRS rates for consensus
                            ratesCount[irsRate] = (ratesCount[irsRate] || 0) + 1;
                            
                            // Get individual entries
                            const entries = [];
                            let rowIndex = 7;
                            let entryTotalMiles = 0;
                            
                            while (worksheet[`A${rowIndex}`]) {
                                const date = worksheet[`A${rowIndex}`]?.v || '';
                                const purpose = worksheet[`B${rowIndex}`]?.v || '';
                                const description = worksheet[`C${rowIndex}`]?.v || '';
                                const miles = parseFloat(worksheet[`D${rowIndex}`]?.v) || 0;
                                
                                entries.push({
                                    date,
                                    purpose,
                                    description,
                                    miles
                                });
                                
                                entryTotalMiles += miles;
                                rowIndex++;
                            }
                            
                            // Validate miles match
                            const milesMatch = Math.abs(totalMiles - entryTotalMiles) < 0.01;
                            
                            processedEmployees.push({
                                name: employeeName,
                                fileName: file.name,
                                totalMiles,
                                irsRate,
                                reportedReimbursement,
                                calculatedReimbursement: entryTotalMiles * irsRate,
                                entries,
                                milesMatch,
                                entryTotalMiles
                            });
                        } catch (err) {
                            console.error(`Error processing file ${file.name}:`, err);
                            setError(`Error processing file "${file.name}". Please ensure it has the expected format.`);
                        }
                    }
                    
                    if (processedEmployees.length === 0) {
                        setError("No valid data could be extracted from the files. Please check the file format.");
                        setLoading(false);
                        return;
                    }
                    
                    // Find most common IRS rate
                    let maxCount = 0;
                    let consensusRate = 0;
                    
                    Object.entries(ratesCount).forEach(([rate, count]) => {
                        if (count > maxCount) {
                            maxCount = count;
                            consensusRate = parseFloat(rate);
                        }
                    });
                    
                    setMostCommonRate(consensusRate);
                    
                    // Apply consensus rate
                    const finalEmployees = processedEmployees.map(employee => ({
                        ...employee,
                        consensusRate,
                        consensusReimbursement: employee.entryTotalMiles * consensusRate
                    }));
                    
                    setEmployees(finalEmployees);
                    setProcessingComplete(true);
                } catch (err) {
                    console.error("Processing error:", err);
                    setError("Error processing files. Please make sure all files are valid Excel spreadsheets.");
                } finally {
                    setLoading(false);
                }
            };
            
            // Toggle expanded employee view
            const toggleEmployeeExpand = (index) => {
                if (expandedEmployee === index) {
                    setExpandedEmployee(null);
                } else {
                    setExpandedEmployee(index);
                }
            };
            
            // Export data to Excel
            const exportToExcel = () => {
                // Create worksheet data
                const exportData = employees.map(employee => ({
                    'Employee Name': employee.name,
                    'Total Miles': employee.entryTotalMiles,
                    'Reimbursement': employee.consensusReimbursement
                }));
                
                // Create workbook and worksheet
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(exportData);
                
                // Add IRS rate at the top of the worksheet
                XLSX.utils.sheet_add_aoa(ws, [
                    ["IRS Mileage Rate:", mostCommonRate.toFixed(3)],
                    [""],  // Empty row for spacing
                    ["Mileage Reimbursement Summary"]
                ], { origin: "A1" });
                
                // Style the headers
                ws['!cols'] = [
                    { wch: 25 },  // Width of Employee Name column
                    { wch: 15 },  // Width of Total Miles column
                    { wch: 15 }   // Width of Reimbursement column
                ];
                
                // Add the worksheet to the workbook
                XLSX.utils.book_append_sheet(wb, ws, "Mileage Reimbursements");
                
                // Generate a filename with current date
                const date = new Date();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                const filename = `TW_Frierson_Mileage_${month}_${year}.xlsx`;
                
                // Write the file and trigger download
                XLSX.writeFile(wb, filename);
            };
            
            return (
                <div>
                    {/* Header */}
                    <header>
                        <div className="container">
                            <div className="header-content">
                                <div className="logo-container">
                                    <div className="logo-icon">
                                        <HelmetIcon color="#333333" />
                                    </div>
                                    <h1 className="company-name">T.W. FRIERSON</h1>
                                </div>
                                <div className="company-title">CONTRACTOR, INC.</div>
                            </div>
                        </div>
                    </header>
                    
                    <main>
                        <div className="container">
                            <h2>Mileage Reimbursement Processor</h2>
                            
                            <p className="intro-text">
                                Streamline your monthly mileage reimbursement process. Drop a folder containing employee 
                                mileage spreadsheets or select individual files to process. The app will validate the data, 
                                apply the correct IRS rate, and generate a summary report.
                            </p>
                            
                            {/* File Drop Zone */}
                            <div 
                                className={`dropzone ${isDragging ? 'active' : ''} 'has-files' : ''} ${files.length > 0 ? 'has-files' : ''}`}
                                onDrop={handleDrop}
                                onDragOver={(e) => {
                                    e.preventDefault();
                                    setIsDragging(true);
                                }}
                                onDragEnter={(e) => {
                                    e.preventDefault();
                                    setIsDragging(true);
                                }}
                                onDragLeave={(e) => {
                                    e.preventDefault();
                                    setIsDragging(false);
                                }}
                            >
                                <div className="icon-container">
                                    <FileIcon size={50} color={files.length > 0 ? "#27ae60" : "#30526E"} />
                                </div>
                                
                                {files.length > 0 ? (
                                    <div className="files-selected">
                                        {files.length} file{files.length !== 1 ? 's' : ''} selected
                                    </div>
                                ) : (
                                    <div className="dropzone-instructions">
                                        <p><strong>Drag & drop</strong> a folder or Excel files here</p>
                                        <p>- OR -</p>
                                    </div>
                                )}
                                
                                <div className="button-group">
                                    <label className="btn btn-primary">
                                        Select Files
                                        <input 
                                            type="file" 
                                            multiple 
                                            onChange={handleFileSelect} 
                                            className="file-input" 
                                            accept=".xlsx,.xls"
                                        />
                                    </label>
                                    
                                    {files.length > 0 && (
                                        <button 
                                            className="btn btn-secondary" 
                                            onClick={processFiles}
                                            disabled={loading}
                                        >
                                            {loading ? 'Processing...' : 'Process Files'}
                                        </button>
                                    )}
                                </div>
                            </div>
                            
                            {/* Error Message */}
                            {error && (
                                <div className="error-container">
                                    <AlertIcon size={24} className="error-icon" />
                                    <p>{error}</p>
                                </div>
                            )}
                            
                            {/* Results */}
                            {processingComplete && employees.length > 0 && (
                                <div className="results-container">
                                    <div className="results-header">
                                        <div>
                                            <h3 className="results-title">Mileage Summary</h3>
                                            <p className="results-subtitle">
                                                Consensus IRS rate: ${mostCommonRate.toFixed(3)} per mile
                                            </p>
                                        </div>
                                        <button 
                                            className="btn btn-primary"
                                            onClick={exportToExcel}
                                        >
                                            <DownloadIcon size={18} style={{marginRight: '8px'}} />
                                            Export to Excel
                                        </button>
                                    </div>
                                    
                                    <div className="table-responsive">
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>Employee</th>
                                                    <th>Total Miles</th>
                                                    <th>Reimbursement</th>
                                                    <th>Status</th>
                                                    <th>Details</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {employees.map((employee, index) => (
                                                    <React.Fragment key={index}>
                                                        <tr>
                                                            <td>
                                                                <div className="employee-name">{employee.name}</div>
                                                                <div className="file-name">{employee.fileName}</div>
                                                            </td>
                                                            <td>
                                                                {employee.entryTotalMiles.toFixed(1)}
                                                                {!employee.milesMatch && (
                                                                    <div className="error-text">
                                                                        (Reported: {employee.totalMiles.toFixed(1)})
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td>
                                                                ${employee.consensusReimbursement.toFixed(2)}
                                                                {Math.abs(employee.consensusReimbursement - employee.reportedReimbursement) > 0.01 && (
                                                                    <div className="error-text">
                                                                        (Reported: ${employee.reportedReimbursement.toFixed(2)})
                                                                    </div>
                                                                )}
                                                                <div className="file-name">
                                                                    Rate: ${employee.consensusRate.toFixed(3)}
                                                                    {employee.irsRate !== employee.consensusRate && (
                                                                        <span className="error-text">
                                                                            (Reported: ${employee.irsRate.toFixed(3)})
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </td>
                                                            <td>
                                                                {employee.milesMatch && Math.abs(employee.consensusReimbursement - employee.reportedReimbursement) <= 0.01 ? (
                                                                    <span className="badge badge-valid">
                                                                        <CheckIcon size={14} className="icon-sm" /> Valid
                                                                    </span>
                                                                ) : (
                                                                    <span className="badge badge-error">
                                                                        <AlertIcon size={14} className="icon-sm" /> Discrepancy
                                                                    </span>
                                                                )}
                                                            </td>
                                                            <td>
                                                                <button 
                                                                    className="view-toggle"
                                                                    onClick={() => toggleEmployeeExpand(index)}
                                                                >
                                                                    {expandedEmployee === index ? 'Hide' : 'View'}
                                                                    {expandedEmployee === index ? (
                                                                        <ChevronUpIcon size={16} className="toggle-icon" />
                                                                    ) : (
                                                                        <ChevronDownIcon size={16} className="toggle-icon" />
                                                                    )}
                                                                </button>
                                                            </td>
                                                        </tr>
                                                        
                                                        {/* Expanded trip details */}
                                                        {expandedEmployee === index && (
                                                            <tr className="details-row">
                                                                <td colSpan="5" className="details-content">
                                                                    <h4 className="details-title">
                                                                        <FileIcon size={18} style={{marginRight: '8px'}} />
                                                                        Trip Details
                                                                    </h4>
                                                                    <div className="table-responsive">
                                                                        <table className="details-table">
                                                                            <thead>
                                                                                <tr>
                                                                                    <th>Date</th>
                                                                                    <th>Purpose</th>
                                                                                    <th>Description</th>
                                                                                    <th>Miles</th>
                                                                                </tr>
                                                                            </thead>
                                                                            <tbody>
                                                                                {employee.entries.map((entry, entryIndex) => (
                                                                                    <tr key={entryIndex}>
                                                                                        <td>{formatExcelDate(entry.date)}</td>
                                                                                        <td>{entry.purpose}</td>
                                                                                        <td>{entry.description}</td>
                                                                                        <td>{entry.miles.toFixed(1)}</td>
                                                                                    </tr>
                                                                                ))}
                                                                                <tr className="total-row">
                                                                                    <td colSpan="3" style={{textAlign: 'right'}}>
                                                                                        Total:
                                                                                    </td>
                                                                                    <td>
                                                                                        {employee.entryTotalMiles.toFixed(1)}
                                                                                    </td>
                                                                                </tr>
                                                                            </tbody>
                                                                        </table>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </React.Fragment>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                    
                    {/* Footer */}
                    <footer>
                        <div className="container">
                            <div className="footer-content">
                                <div className="footer-logo">
                                    <div className="footer-icon">
                                        <HelmetIcon size={18} color="#333333" />
                                    </div>
                                    <div className="footer-name">T.W. FRIERSON CONTRACTOR, INC.</div>
                                </div>
                                <div className="footer-message">Build with Purpose</div>
                            </div>
                        </div>
                    </footer>
                    
                    {/* Loading Overlay */}
                    {loading && (
                        <div className="loading-overlay">
                            <div>
                                <div className="loading-spinner"></div>
                                <div className="loading-text">Processing files...</div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        
        // Render the app
        ReactDOM.render(<MileageProcessor />, document.getElementById('app'));
    </script>
</body>
</html>
